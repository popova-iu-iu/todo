# Публикация приложения на GitLab Pages.
# Здесь только код программы — заметок в этом репозитории нет.
image: node:22

pages:
  stage: deploy
  cache:
    key: npm
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
    - npm run build
    - rm -rf public && mv dist public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
